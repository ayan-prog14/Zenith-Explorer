<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith Explorer - File Manager</title>
    <!-- Tailwind CSS for modern sleek styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        accent: '#38bdf8'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkbg text-slate-100 font-sans min-h-screen flex flex-col">

    <!-- Top Header Bar -->
    <header class="bg-cardbg border-b border-slate-800 px-4 py-3 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="bg-accent text-darkbg p-2 rounded-xl font-bold flex items-center justify-center w-10 h-10 shadow-lg shadow-sky-500/20">
                <i class="fa-solid fa-compass text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-wide text-white">Zenith Explorer</h1>
                <p class="text-xs text-slate-400">Internal Storage</p>
            </div>
        </div>
        <button onclick="triggerCleaner()" class="bg-slate-800 hover:bg-slate-700 text-accent text-xs font-semibold px-3 py-2 rounded-lg border border-slate-700 transition flex items-center space-x-2">
            <i class="fa-solid fa-broom"></i>
            <span>Clean Junk</span>
        </button>
    </header>

    <!-- Storage Info Card -->
    <div class="p-4">
        <div class="bg-cardbg border border-slate-800 rounded-2xl p-4 shadow-xl">
            <div class="flex justify-between text-sm mb-2">
                <span class="text-slate-400 font-medium">Device Storage</span>
                <span class="text-accent font-bold" id="storage-text">42.5 GB / 128 GB Free</span>
            </div>
            <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden p-0.5">
                <div id="storage-bar" class="bg-gradient-to-r from-sky-500 to-indigo-500 h-full rounded-full transition-all duration-500" style="width: 65%"></div>
            </div>
        </div>
    </div>

    <!-- Quick Navigation Folders -->
    <div class="px-4 mb-3">
        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Categories</h2>
        <div class="grid grid-cols-4 gap-3 text-center">
            <div onclick="filterCategory('images')" class="bg-cardbg p-3 rounded-xl border border-slate-800 hover:border-accent cursor-pointer transition">
                <i class="fa-solid fa-image text-sky-400 text-xl mb-1"></i>
                <p class="text-xs text-slate-300">Images</p>
            </div>
            <div onclick="filterCategory('videos')" class="bg-cardbg p-3 rounded-xl border border-slate-800 hover:border-accent cursor-pointer transition">
                <i class="fa-solid fa-video text-purple-400 text-xl mb-1"></i>
                <p class="text-xs text-slate-300">Videos</p>
            </div>
            <div onclick="filterCategory('audio')" class="bg-cardbg p-3 rounded-xl border border-slate-800 hover:border-accent cursor-pointer transition">
                <i class="fa-solid fa-music text-pink-400 text-xl mb-1"></i>
                <p class="text-xs text-slate-300">Audio</p>
            </div>
            <div onclick="filterCategory('docs')" class="bg-cardbg p-3 rounded-xl border border-slate-800 hover:border-accent cursor-pointer transition">
                <i class="fa-solid fa-file-lines text-emerald-400 text-xl mb-1"></i>
                <p class="text-xs text-slate-300">Docs</p>
            </div>
        </div>
    </div>

    <!-- File List Section -->
    <div class="px-4 flex-1 pb-20">
        <div class="flex justify-between items-center mb-3">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Recent Files</h2>
            <button onclick="resetView()" class="text-xs text-accent hover:underline">View All</button>
        </div>
        
        <div id="file-list" class="space-y-2">
            <!-- Dynamic files injected via JavaScript -->
        </div>
    </div>

    <!-- Toast Notification Popup -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-4 py-2 rounded-xl text-sm border border-slate-700 shadow-2xl opacity-0 pointer-events-none transition-opacity duration-300 z-50">
        Action completed successfully
    </div>

    <script>
        // Sample file data for Zenith Explorer
        const mockFiles = [
            { name: "Vacation_Photo_01.jpg", type: "images", size: "4.2 MB", date: "Today, 2:15 PM", icon: "fa-image text-sky-400" },
            { name: "Phonk_Mix_Final.mp3", type: "audio", size: "12.8 MB", date: "Yesterday", icon: "fa-music text-pink-400" },
            { name: "Project_Blueprint.pdf", type: "docs", size: "2.5 MB", date: "Nov 4", icon: "fa-file-pdf text-red-400" },
            { name: "ScreenRecord_Gameplay.mp4", type: "videos", size: "45.0 MB", date: "Nov 2", icon: "fa-video text-purple-400" },
            { name: "App_Notes.txt", type: "docs", size: "12 KB", date: "Oct 28", icon: "fa-file-lines text-emerald-400" },
            { name: "Wallpaper_Zenith.png", type: "images", size: "3.1 MB", date: "Oct 25", icon: "fa-image text-sky-400" }
        ];

        function renderFiles(filesToRender) {
            const listContainer = document.getElementById('file-list');
            listContainer.innerHTML = '';

            if(filesToRender.length === 0) {
                listContainer.innerHTML = `<p class="text-center text-slate-500 py-6 text-sm">No files found in this category.</p>`;
                return;
            }

            filesToRender.forEach(file => {
                const item = document.createElement('div');
                item.className = "bg-cardbg border border-slate-800 p-3 rounded-xl flex items-center justify-between hover:border-slate-700 transition";
                item.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-lg bg-slate-800 flex items-center justify-center text-lg">
                            <i class="fa-solid ${file.icon}"></i>
                        </div>
                        <div>
                            <p class="text-sm font-medium text-slate-200">${file.name}</p>
                            <p class="text-xs text-slate-400">${file.size} • ${file.date}</p>
                        </div>
                    </div>
                    <button onclick="showToast('Opened ${file.name}')" class="text-slate-400 hover:text-white p-2">
                        <i class="fa-solid fa-ellipsis-vertical"></i>
                    </button>
                `;
                listContainer.appendChild(item);
            });
        }

        function filterCategory(category) {
            const filtered = mockFiles.filter(f => f.type === category);
            renderFiles(filtered);
            showToast(`Filtered by ${category}`);
        }

        function resetView() {
            renderFiles(mockFiles);
        }

        function triggerCleaner() {
            showToast('🧹 Cleaned 450 MB of temporary cache junk!');
            const storageBar = document.getElementById('storage-bar');
            storageBar.style.width = '55%';
            document.getElementById('storage-text').innerText = "48.2 GB / 128 GB Free";
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2500);
        }

        // Initialize view on load
        renderFiles(mockFiles);
    </script>
</body>
</html>
